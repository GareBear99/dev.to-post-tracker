name = "devto-ecosystem-autoposter"
main = "cloudflare-worker/src/index.js"
compatibility_date = "2026-05-15"

# Runs every hour. Adjust once traffic volume is known.
[triggers]
crons = ["0 * * * *"]

# Create this namespace with:
#   npx wrangler kv namespace create DEVTO_AUTOPUBLISH_STATE
# Then paste the returned id below.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[vars]
# Keep Cloudflare KV as the required v1 state store. Atlas is optional through ARCHIVE_WEBHOOK_URL.
DEVTO_USERNAME = "tizwildin"
AUTOPOST_TARGETS = "mastodon,discord,telegram,libhunt"
DEFAULT_ECOSYSTEM_TAG = "#BuildInPublic"
ARCHIVE_PROVIDER = "mongodb-atlas-collector"
